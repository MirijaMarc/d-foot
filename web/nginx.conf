# Serves the built Vue app. The app uses history-mode URLs (/joueur, /match...):
# any path that isn't a real file falls back to index.html, and vue-router
# shows the right page.
server {
    listen 80;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Built JS/CSS files: a missing one is a real 404, not the HTML page.
    location /assets/ {
        try_files $uri =404;
    }
}
