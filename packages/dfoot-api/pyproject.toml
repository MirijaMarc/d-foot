[project]
name = "dfoot-api"
version = "0.1.0"
description = "D-Foot: HTTP API serving the gold layer"
requires-python = ">=3.12"
dependencies = [
    "dfoot-core",
    "fastapi>=0.162.5",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.uv.sources]
dfoot-core = { workspace = true }
