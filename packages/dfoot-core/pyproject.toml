[project]
name = "dfoot-core"
version = "0.1.0"
description = "D-Foot: settings and storage abstraction shared by every package"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.44.1",
    "duckdb>=2.0.0",
    "pydantic-settings>=2.16.2",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"
