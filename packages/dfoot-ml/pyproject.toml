[project]
name = "dfoot-ml"
version = "0.1.0"
description = "D-Foot: xG model training and evaluation"
requires-python = ">=3.12"
dependencies = [
    "dfoot-core",
    "lightgbm>=4.7.0",
    "mlflow>=3.18.0",
    "scikit-learn>=1.9.1",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.uv.sources]
dfoot-core = { workspace = true }
